<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Step into the yellow creature’s illustrated world.">
<title>Yellow creature · The Painted Cabinet</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{margin:0;min-height:100%;background:#fbffd0}
body.creature-world{display:block;min-height:100svh;padding:0}
.world-background{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.world-stage{position:relative;width:min(100vw,177.777778svh);aspect-ratio:16/9}
.world-static,.world-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.world-canvas{opacity:0}
.motion-control{position:fixed;right:16px;bottom:16px;z-index:1;border:1px solid #31283e66;border-radius:3px;padding:7px 11px;background:#fbffd0dd;color:#31283e;cursor:pointer;font:14px Pixelta,monospace}
.motion-control:focus-visible{outline:3px solid #326f5d;outline-offset:4px}
.world-back{position:fixed;z-index:1;top:max(16px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));padding:10px 14px;border:1px solid #31283e;border-radius:3px;background:#fbffd0ed;color:#31283e;font:16px Pixelta,monospace;text-decoration:none;box-shadow:2px 3px 0 #31283e26}
.world-back:hover{background:#fffde8}
.world-back:focus-visible{outline:3px solid #326f5d;outline-offset:4px}
.world-spots{position:absolute;inset:0;z-index:2;pointer-events:none}
.world-spot{position:absolute;pointer-events:auto;display:block;border:0;border-radius:0;padding:0;background:transparent;cursor:help;-webkit-tap-highlight-color:transparent}
.world-spot:focus-visible{outline:2px dashed #00BD8B;outline-offset:3px}
.world-tooltip{position:fixed;z-index:10;max-width:min(340px,calc(100vw - 24px));padding:7px 11px;background:#00BD8B;color:#fff;border:0;border-radius:0;font:normal clamp(18px,1.6vw,24px)/1.3 Pixelta,monospace;white-space:normal;overflow-wrap:break-word;pointer-events:none;box-sizing:border-box}
.world-tooltip.is-red{background:#E33D32}
.world-tooltip[hidden]{display:none}
.what-else-layer{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.what-else-stamp{position:absolute;display:block;transform:translate(-50%,-50%);background:#E33D32;color:#fff;padding:7px 11px;border:0;border-radius:0;font:normal clamp(18px,1.6vw,24px)/1.3 Pixelta,monospace;white-space:nowrap;pointer-events:none}
</style>
</head>
<body class="creature-world">
<main class="world-background">
<div class="world-stage">
<img class="world-static" src="assets/yellow-creature-world.png" alt="An illustrated world of yellow creatures, birds, flowers, castles and boats on turquoise water.">
<canvas class="world-canvas" aria-hidden="true"></canvas>
<div class="world-spots" aria-label="Characters and places to explore">
<button type="button" class="world-spot" data-spot="what-else" data-color="red" data-message="WHAT ELSE" aria-label="The standing character beneath the bird" style="left:54.1667%;top:13.8889%;width:6.25%;height:18.0556%"></button>
<button type="button" class="world-spot" data-spot="1" data-message="* DJ noises *" aria-label="The DJs" style="left:38.2812%;top:24.0741%;width:11.9792%;height:15.2778%"></button>
<button type="button" class="world-spot" data-spot="2" data-message="&quot;kind of just...bs-ing.&quot;" aria-label="The chatting pair" style="left:42.1875%;top:40.2778%;width:11.7188%;height:15.7407%"></button>
<button type="button" class="world-spot" data-spot="3" data-message="&quot;I think I really love you.&quot;" aria-label="The pair in the little boat" style="left:69.7917%;top:84.2593%;width:9.3750%;height:11.5741%"></button>
<button type="button" class="world-spot" data-spot="4" data-message="&quot;mmmhm...beer...&quot;" aria-label="The beer drinkers" style="left:64.5833%;top:52.3148%;width:10.6771%;height:11.5741%"></button>
<button type="button" class="world-spot" data-spot="5" data-message="ZzzzZzZZZZz" aria-label="The sleeping creature" style="left:65.1042%;top:36.1111%;width:8.8542%;height:12.9630%"></button>
<button type="button" class="world-spot" data-spot="6" data-message="&quot;I want to be free.&quot;" aria-label="The large flying bird" style="left:30.7292%;top:2.7778%;width:19.2708%;height:18.9815%"></button>
<button type="button" class="world-spot" data-spot="7a" data-message="&quot;birb&quot;" aria-label="The upper little water bird" style="left:1.8229%;top:83.6111%;width:6.5104%;height:6.7593%"></button>
<button type="button" class="world-spot" data-spot="7b" data-message="&quot;birb&quot;" aria-label="The lower little water bird" style="left:0.2604%;top:93.8889%;width:7.2917%;height:6.1111%"></button>
<button type="button" class="world-spot" data-spot="8" data-message="&quot;where is my destination?&quot;" aria-label="The bird above the standing creature" style="left:47.9167%;top:0.0000%;width:14.3229%;height:12.0370%"></button>
<button type="button" class="world-spot" data-spot="9" data-message="&quot;I want to go home.&quot;" aria-label="The bird above the tall flowers" style="left:62.3958%;top:0.0000%;width:14.0625%;height:9.2593%"></button>
<button type="button" class="world-spot" data-spot="10" data-message="We are flowers." aria-label="The purple flowers on the left" style="left:7.1875%;top:18.0556%;width:10.9375%;height:17.5926%"></button>
<button type="button" class="world-spot" data-spot="11" data-message="&quot;where do you come from?&quot;" aria-label="The left castle" style="left:23.5938%;top:50.9259%;width:12.7604%;height:43.5185%"></button>
<button type="button" class="world-spot" data-spot="12" data-message="&quot;where do you go to?&quot;" aria-label="The right castle" style="left:75.0000%;top:44.9074%;width:19.7917%;height:38.8889%"></button>
<button type="button" class="world-spot" data-spot="A" data-message="&quot;Hello.&quot;" aria-label="The first passenger" style="left:46.0938%;top:70.9259%;width:4.3750%;height:11.4815%"></button>
<button type="button" class="world-spot" data-spot="B" data-message="&quot;hEllo.&quot;" aria-label="The second passenger" style="left:50.5208%;top:70.9259%;width:3.8021%;height:11.4815%"></button>
<button type="button" class="world-spot" data-spot="C" data-message="&quot;heLLo&quot;" aria-label="The third passenger" style="left:54.3750%;top:70.9259%;width:3.4375%;height:11.4815%"></button>
<button type="button" class="world-spot" data-spot="D" data-message="&quot;hellO&quot;" aria-label="The fourth passenger" style="left:57.8646%;top:71.2963%;width:4.2708%;height:11.1111%"></button>
<button type="button" class="world-spot" data-spot="E" data-message="&quot;goodbye&quot;" aria-label="The standing boat passenger" style="left:61.9792%;top:62.9630%;width:7.2917%;height:18.5185%"></button>
</div>
</div>
</main>
<a class="world-back" href="index.html">← Back to the cabinet</a>
<button class="motion-control" type="button" aria-pressed="false">Pause motion</button>
<div id="world-tooltip" class="world-tooltip" role="tooltip" hidden></div>
<script src="world-motion.js" defer></script>
<script src="world-spots.js" defer></script>
<script src="world-clicks.js" defer></script>
</body>
</html>
